[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "ledgerly-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # DB
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Auth
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    # Numeric
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "numpy-financial>=1.0.0",
    # Scheduling
    "apscheduler>=3.10.4",
    # CSV / data
    "chardet>=5.2.0",
    # Statement formats (OFX/QFX). QIF and CAMT.053 are parsed with the stdlib.
    "ofxparse>=0.21",
    # PDF statement parsing (table + text extraction).
    "pdfplumber>=0.11",
    # Crypto (at-rest encryption helpers)
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "anyio[trio]>=4.4.0",     # async test backend
    "httpx>=0.27.0",          # AsyncClient for integration tests
    "httpx[asyncio]>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
