# Test stack: Postgres only + ephemeral API container for integration tests.
# Usage:
#   docker compose -f docker-compose.test.yml run --rm api-test
#
# `name:` gives this its own Compose project, separate from the main
# docker-compose.yml stack (which otherwise shares the same default
# "ledgerly" project name derived from the directory — causing every test
# run to warn about the main stack's containers as "orphans" and, more
# seriously, contend over the same project namespace/network state).
name: ledgerly-test

services:
  db-test:
    image: postgres:17-alpine3.21
    environment:
      POSTGRES_DB: ledgerly_test
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly -d ledgerly_test"]
      interval: 3s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data   # in-memory — ephemeral

  api-test:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["pytest", "app/tests/", "-v", "--tb=short"]
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://ledgerly:test@db-test/ledgerly_test
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key-not-for-production
      ENCRYPTION_KEY: test-encryption-key-1234567890abcdef
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - ./api:/app
